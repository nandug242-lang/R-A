<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rythu Aasara</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f1;
    color: #173d20;
}

.header {
    background: #ffffff;
    padding: 18px 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.logo {
    width: 105px;
    height: 105px;
    object-fit: contain;
    border-radius: 50%;
}

.title {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.subtitle {
    font-size: 16px;
    color: #52705a;
    margin-top: 5px;
}

.welcome {
    padding: 22px 18px 10px;
}

.welcome h2 {
    margin: 0;
    font-size: 23px;
}

.welcome p {
    color: #5d6f62;
}

.cards {
    padding: 10px 18px 25px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
}

.card-icon {
    font-size: 35px;
}

.card h3 {
    margin: 10px 0 6px;
    font-size: 20px;
}

.card p {
    margin: 0 0 15px;
    color: #657267;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    background: #238636;
    color: white;
}

.help {
    background: #c62828;
}

.donate {
    background: #e68a00;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #718074;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
    <img src="ra_logo.png" class="logo" alt="Rythu Aasara Logo">
    <div class="title">Rythu Aasara</div>
    <div class="subtitle">రైతు ఆసరా</div>
</div>

<div class="welcome">
    <h2>Welcome, Farmer 👨‍🌾</h2>
    <p>Farmers helping farmers — together we grow.</p>
</div>

<div class="cards">

    <div class="card">
        <div class="card-icon">👨‍🌾</div>
        <h3>Farmer</h3>
        <p>Get farming support, information and assistance.</p>
        <button onclick="farmer()">Continue as Farmer</button>
    </div>

    <div class="card">
        <div class="card-icon">🤝</div>
        <h3>Donate</h3>
        <p>Help a farmer by donating useful items or support.</p>
        <button class="donate" onclick="donate()">Donate</button>
    </div>

    <div class="card">
        <div class="card-icon">🆘</div>
        <h3>I Need Help</h3>
        <p>Request help for your farming needs.</p>
        <button class="help" onclick="needHelp()">I Need Help</button>
    </div>

</div>

<div class="footer">
    © 2026 Rythu Aasara
</div>

<script>

function farmer() {
    alert("Farmer section coming next.");
}

function donate() {
    alert("Donation section coming next.");
}

function needHelp() {
    alert("Help request section coming next.");
}

</script>

</body>
</html>
